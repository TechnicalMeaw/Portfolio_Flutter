pluginManagement {
    // Resolve Flutter SDK path from local.properties
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(rootDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        return properties.getProperty("flutter.sdk")
    }()

    // Flutter Gradle plugin
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()

        // Flutter engine artifacts (local Maven repo)
        maven {
            url = uri("${rootDir}/../bin/cache/artifacts/engine/android")
        }
    }
}

rootProject.name = "android"
include(":app")
